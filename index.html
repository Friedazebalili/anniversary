<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#120810">

  <meta
    name="description"
    content="A romantic anniversary page created with love."
  >

  <title>Happy Anniversary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --page-background: #090407;
      --page-background-soft: #170a14;
      --white: #fff9fc;
      --muted: rgba(255, 241, 247, 0.72);
      --pink: #f4b6cc;
      --light-pink: #ffe2ec;
      --rose: #d99aae;
      --border: rgba(255, 234, 242, 0.14);
      --shadow: rgba(0, 0, 0, 0.56);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --content-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--page-background);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(
          circle at 50% -5%,
          rgba(227, 128, 170, 0.22),
          transparent 33%
        ),
        radial-gradient(
          circle at 10% 55%,
          rgba(135, 48, 93, 0.12),
          transparent 30%
        ),
        radial-gradient(
          circle at 90% 60%,
          rgba(239, 160, 193, 0.1),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #1c0d19 0%,
          #10070e 48%,
          #080407 100%
        );
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .page {
      position: relative;
      min-height: 100vh;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      pointer-events: none;
      background:
        radial-gradient(
          circle at 50% 18%,
          rgba(255, 217, 232, 0.06),
          transparent 26%
        ),
        linear-gradient(
          140deg,
          rgba(42, 17, 36, 0.5),
          transparent 48%
        );
    }

    .page::after {
      content: "";
      position: fixed;
      inset: auto 0 0;
      z-index: -2;
      height: 38vh;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(4, 2, 4, 0.58)
        );
    }

    .hero {
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        max(42px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(42px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
    }

    .hero__container {
      width: min(var(--content-width), 100%);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(28px, 4vw, 48px);
    }

    .hero__content {
      width: min(920px, 100%);
      text-align: center;
      animation: contentReveal 1s var(--ease) both;
    }

    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin: 0 0 16px;
      color: rgba(255, 234, 242, 0.68);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .hero__eyebrow::before,
    .hero__eyebrow::after {
      content: "";
      width: clamp(24px, 5vw, 68px);
      height: 1px;
    }

    .hero__eyebrow::before {
      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255, 221, 234, 0.5)
        );
    }

    .hero__eyebrow::after {
      background:
        linear-gradient(
          90deg,
          rgba(255, 221, 234, 0.5),
          transparent
        );
    }

    .hero__title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(49px, 7.4vw, 108px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      color: transparent;
      background:
        linear-gradient(
          105deg,
          #754759 0%,
          #f5d4df 12%,
          #ffffff 22%,
          #a96e84 34%,
          #fff0f5 47%,
          #965d71 59%,
          #ffffff 72%,
          #d9a5b5 85%,
          #744557 100%
        );
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.12);
      filter:
        drop-shadow(0 12px 30px rgba(0, 0, 0, 0.42));
      animation: chromeShine 8s 1.4s ease-in-out infinite;
    }

    .hero__script {
      margin: 10px 0 0;
      color: var(--light-pink);
      font-family: "Great Vibes", cursive;
      font-size: clamp(38px, 5vw, 70px);
      font-weight: 400;
      line-height: 1;
      text-shadow:
        0 8px 24px rgba(0, 0, 0, 0.42),
        0 0 22px rgba(255, 177, 207, 0.16);
    }

    .hero__message {
      max-width: 640px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(14px, 1.45vw, 18px);
      font-weight: 300;
      line-height: 1.75;
      letter-spacing: 0.01em;
    }

    .hero__image-stage {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      animation: imageReveal 1.2s 0.16s var(--ease) both;
    }

    .hero__glow {
      position: absolute;
      inset: 8% 10% -4%;
      z-index: -1;
      border-radius: 45%;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 177, 208, 0.28),
          rgba(205, 93, 143, 0.1) 46%,
          transparent 75%
        );
      filter: blur(54px);
    }

    .hero__image-frame {
      position: relative;
      width: min(100%, 900px);
      aspect-ratio: 1122 / 1402;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: clamp(24px, 3vw, 42px);
      background: #10070e;
      box-shadow:
        0 46px 120px var(--shadow),
        0 0 0 1px rgba(255, 255, 255, 0.035),
        0 0 75px rgba(231, 136, 176, 0.14);
      transform: translateZ(0);
    }

    .hero__image-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.09),
        inset 0 0 78px rgba(0, 0, 0, 0.14);
    }

    .hero__image-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(
          180deg,
          rgba(10, 4, 9, 0.01),
          transparent 62%,
          rgba(7, 3, 6, 0.12)
        );
    }

    .hero__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.002);
      transition: transform 0.8s var(--ease);
    }

    .hero__image-frame:hover .hero__image {
      transform: scale(1.015);
    }

    .hero__footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: rgba(255, 237, 244, 0.54);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: footerReveal 0.9s 0.6s var(--ease) both;
    }

    .hero__footer-dot {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--pink);
      box-shadow:
        0 0 13px rgba(247, 190, 210, 0.85);
    }

    @keyframes contentReveal {
      from {
        opacity: 0;
        transform: translateY(-24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes imageReveal {
      from {
        opacity: 0;
        transform: translateY(32px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes footerReveal {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes chromeShine {
      0%,
      18% {
        background-position: 115% 50%;
      }

      48%,
      100% {
        background-position: -115% 50%;
      }
    }

    @media (max-width: 900px) {
      .hero {
        padding-left: 16px;
        padding-right: 16px;
      }

      .hero__container {
        gap: 30px;
      }

      .hero__image-frame {
        width: min(100%, 720px);
        border-radius: 28px;
      }
    }

    @media (max-width: 640px) {
      .hero {
        min-height: auto;
        padding:
          max(26px, env(safe-area-inset-top))
          10px
          max(28px, env(safe-area-inset-bottom));
      }

      .hero__container {
        gap: 23px;
      }

      .hero__content {
        padding-inline: 8px;
      }

      .hero__eyebrow {
        margin-bottom: 11px;
        font-size: 8px;
        letter-spacing: 0.22em;
      }

      .hero__eyebrow::before,
      .hero__eyebrow::after {
        width: 22px;
      }

      .hero__title {
        font-size: clamp(39px, 12vw, 60px);
        line-height: 0.93;
      }

      .hero__script {
        margin-top: 7px;
        font-size: clamp(32px, 10vw, 46px);
      }

      .hero__message {
        max-width: 355px;
        margin-top: 13px;
        font-size: 13px;
        line-height: 1.6;
      }

      .hero__image-frame {
        width: min(100%, 520px);
        aspect-ratio: 1122 / 1402;
        border-radius: 20px;
      }

      .hero__footer {
        font-size: 8px;
        letter-spacing: 0.16em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <section
      class="hero"
      id="hero"
      aria-labelledby="hero-title"
    >
      <div class="hero__container">
        <header class="hero__content">
          <p class="hero__eyebrow">
            A Love Worth Celebrating
          </p>

          <h1 class="hero__title" id="hero-title">
            Happy Anniversary
          </h1>

          <p class="hero__script">
            To my beautiful girl
          </p>

          <p class="hero__message">
            Every moment with you is my favorite, and every memory
            we create becomes another beautiful part of the life
            I always want to share with you.
          </p>
        </header>

        <div class="hero__image-stage">
          <div
            class="hero__glow"
            aria-hidden="true"
          ></div>

          <div class="hero__image-frame">
            <img
              class="hero__image"
              src="https://raw.githubusercontent.com/Friedazebalili/anniversary/1cee58e2b08a23aad86acdddce2020f1679450bb/assets/anniversary.png"
              alt="A romantic anniversary collage featuring the couple and portraits"
              width="1122"
              height="1402"
              fetchpriority="high"
              decoding="async"
            >
          </div>
        </div>

        <div class="hero__footer" aria-hidden="true">
          <span class="hero__footer-dot"></span>
          <span>Made with all my love</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
