<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120810">
  <meta name="description" content="A romantic anniversary experience made with love.">
  <title>Happy Anniversary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090407;
      --bg-soft: #180a15;
      --white: #fff9fc;
      --muted: rgba(255, 241, 247, 0.76);
      --pink: #ffb7d1;
      --pink-soft: #ffd8e6;
      --pink-strong: #ff5fa2;
      --rose: #dc90ad;
      --border: rgba(255, 235, 243, 0.16);
      --shadow: rgba(0, 0, 0, 0.58);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      height: 100%;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 50% -8%, rgba(229, 127, 170, 0.22), transparent 34%),
        radial-gradient(circle at 12% 70%, rgba(122, 42, 85, 0.14), transparent 30%),
        radial-gradient(circle at 88% 68%, rgba(245, 152, 190, 0.12), transparent 30%),
        linear-gradient(180deg, #1c0d19 0%, #10070e 48%, #080407 100%);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 600px;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -4;
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.025), transparent 28%, transparent 70%, rgba(255, 255, 255, 0.02)),
        radial-gradient(circle at 50% 20%, rgba(255, 216, 231, 0.07), transparent 26%);
    }

    .page::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      z-index: -3;
      height: 30%;
      background: linear-gradient(180deg, transparent, rgba(4, 2, 4, 0.55));
      pointer-events: none;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100%;
      padding:
        max(18px, env(safe-area-inset-top))
        max(20px, env(safe-area-inset-right))
        max(18px, env(safe-area-inset-bottom))
        max(20px, env(safe-area-inset-left));
    }

    .hero__container {
      position: relative;
      width: min(1240px, 100%);
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      gap: clamp(12px, 2vh, 20px);
      align-items: center;
    }

    .hero__header {
      position: relative;
      z-index: 8;
      width: min(920px, 100%);
      margin: 0 auto;
      text-align: center;
      animation: headerReveal 1s var(--ease) both;
    }

    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 8px;
      color: rgba(255, 233, 242, 0.67);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .hero__eyebrow::before,
    .hero__eyebrow::after {
      content: "";
      width: clamp(20px, 4vw, 58px);
      height: 1px;
    }

    .hero__eyebrow::before {
      background: linear-gradient(90deg, transparent, rgba(255, 220, 234, 0.5));
    }

    .hero__eyebrow::after {
      background: linear-gradient(90deg, rgba(255, 220, 234, 0.5), transparent);
    }

    .hero__title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(38px, 5.5vw, 82px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      color: transparent;
      background:
        linear-gradient(
          105deg,
          #754759 0%,
          #f5d4df 12%,
          #ffffff 22%,
          #a96e84 34%,
          #fff0f5 47%,
          #965d71 59%,
          #ffffff 72%,
          #d9a5b5 85%,
          #744557 100%
        );
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.12);
      filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.42));
      animation: chromeShine 8s 1.2s ease-in-out infinite;
    }

    .hero__script {
      margin: 3px 0 0;
      color: var(--pink-soft);
      font-family: "Great Vibes", cursive;
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 400;
      line-height: 1;
      text-shadow:
        0 7px 22px rgba(0, 0, 0, 0.42),
        0 0 20px rgba(255, 178, 207, 0.15);
    }

    .hero__message {
      max-width: 580px;
      margin: 8px auto 0;
      color: var(--muted);
      font-size: clamp(12px, 1.15vw, 15px);
      font-weight: 300;
      line-height: 1.55;
      letter-spacing: 0.01em;
    }

    .hero__image-stage {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: imageReveal 1.2s 0.12s var(--ease) both;
    }

    .hero__glow {
      position: absolute;
      inset: 8% 8% -3%;
      z-index: -3;
      border-radius: 46%;
      background:
        radial-gradient(
          ellipse at center,
          rgba(255, 177, 208, 0.3),
          rgba(210, 95, 146, 0.12) 46%,
          transparent 76%
        );
      filter: blur(50px);
      opacity: 0.9;
      animation: glowPulse 4.8s ease-in-out infinite;
      pointer-events: none;
    }

    .hero__lightning {
      position: absolute;
      inset: -8px;
      z-index: -1;
      border-radius: clamp(22px, 2.4vw, 38px);
      pointer-events: none;
      opacity: 0.68;
      filter: blur(1px);
    }

    .hero__lightning::before,
    .hero__lightning::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
    }

    .hero__lightning::before {
      background:
        linear-gradient(90deg, transparent 2%, rgba(255, 99, 166, 0.95) 5%, transparent 8%) top left / 30% 2px no-repeat,
        linear-gradient(90deg, transparent 35%, rgba(255, 190, 221, 0.95) 46%, transparent 55%) top center / 42% 2px no-repeat,
        linear-gradient(90deg, transparent 72%, rgba(255, 96, 163, 0.95) 86%, transparent 98%) top right / 35% 2px no-repeat,
        linear-gradient(180deg, transparent 4%, rgba(255, 115, 174, 0.9) 14%, transparent 26%) left top / 2px 34% no-repeat,
        linear-gradient(180deg, transparent 45%, rgba(255, 180, 214, 0.95) 56%, transparent 70%) right center / 2px 34% no-repeat,
        linear-gradient(90deg, transparent 8%, rgba(255, 109, 171, 0.95) 24%, transparent 40%) bottom left / 36% 2px no-repeat,
        linear-gradient(90deg, transparent 48%, rgba(255, 205, 226, 0.95) 58%, transparent 72%) bottom center / 42% 2px no-repeat,
        linear-gradient(90deg, transparent 78%, rgba(255, 93, 160, 0.95) 90%, transparent 100%) bottom right / 30% 2px no-repeat;
      box-shadow:
        0 0 12px rgba(255, 91, 160, 0.9),
        0 0 26px rgba(255, 95, 164, 0.55),
        inset 0 0 18px rgba(255, 102, 168, 0.18);
      animation: lightningPulse 2.4s ease-in-out infinite;
    }

    .hero__lightning::after {
      inset: -3px;
      border: 1px solid rgba(255, 127, 183, 0.28);
      box-shadow:
        0 0 18px rgba(255, 99, 166, 0.38),
        0 0 42px rgba(255, 99, 166, 0.18);
      animation: lightningHalo 3.4s ease-in-out infinite;
    }

    .hero__image-frame {
      position: relative;
      width: min(100%, 900px);
      height: 100%;
      max-height: min(68svh, 760px);
      aspect-ratio: 1122 / 1402;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: clamp(22px, 2.6vw, 40px);
      background: #10070e;
      box-shadow:
        0 32px 90px var(--shadow),
        0 0 0 1px rgba(255, 255, 255, 0.035),
        0 0 60px rgba(231, 136, 176, 0.15);
      transform: translateZ(0);
    }

    .hero__image-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.09),
        inset 0 0 70px rgba(0, 0, 0, 0.12);
    }

    .hero__image-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(10, 4, 9, 0.01), transparent 60%, rgba(7, 3, 6, 0.1));
    }

    .hero__image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
      transform: scale(1.001);
      transition: transform 0.8s var(--ease);
    }

    .hero__image-frame:hover .hero__image {
      transform: scale(1.012);
    }

    .hero__footer {
      position: relative;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: rgba(255, 237, 244, 0.54);
      font-size: 9px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: footerReveal 0.9s 0.55s var(--ease) both;
    }

    .hero__footer-dot {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 13px rgba(247, 190, 210, 0.85);
    }

    .effects {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      width: var(--size);
      height: var(--size);
      opacity: 0;
      transform: rotate(45deg);
      background: linear-gradient(135deg, rgba(255, 204, 225, 0.96), rgba(255, 89, 157, 0.86));
      filter: drop-shadow(0 0 10px rgba(255, 100, 164, 0.65));
      animation: heartFloat var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before {
      left: -50%;
      top: 0;
    }

    .heart::after {
      left: 0;
      top: -50%;
    }

    .sparkle {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: rgba(255, 232, 242, 0.95);
      box-shadow:
        0 0 7px rgba(255, 208, 226, 0.95),
        0 0 14px rgba(255, 114, 171, 0.5);
      animation: sparkleTwinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    @keyframes headerReveal {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes imageReveal {
      from {
        opacity: 0;
        transform: translateY(26px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes footerReveal {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes chromeShine {
      0%,
      18% {
        background-position: 115% 50%;
      }

      48%,
      100% {
        background-position: -115% 50%;
      }
    }

    @keyframes glowPulse {
      0%,
      100% {
        opacity: 0.6;
        transform: scale(0.97);
      }

      50% {
        opacity: 1;
        transform: scale(1.04);
      }
    }

    @keyframes lightningPulse {
      0%,
      100% {
        opacity: 0.35;
        filter: brightness(0.85);
        transform: scale(0.998);
      }

      10% {
        opacity: 0.95;
        filter: brightness(1.45);
      }

      16% {
        opacity: 0.45;
      }

      22% {
        opacity: 1;
        filter: brightness(1.7);
      }

      48% {
        opacity: 0.55;
      }

      72% {
        opacity: 0.88;
        filter: brightness(1.35);
      }
    }

    @keyframes lightningHalo {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.995);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.012);
      }
    }

    @keyframes heartFloat {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(45deg) scale(0.7);
      }

      10% {
        opacity: 0.72;
      }

      55% {
        opacity: 0.5;
      }

      100% {
        opacity: 0;
        transform:
          translate3d(var(--drift), -115vh, 0)
          rotate(405deg)
          scale(1.1);
      }
    }

    @keyframes sparkleTwinkle {
      0%,
      100% {
        opacity: 0.15;
        transform: scale(0.7);
      }

      50% {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    @media (max-width: 900px) {
      .page {
        min-height: 640px;
      }

      .hero {
        padding-left: 14px;
        padding-right: 14px;
      }

      .hero__container {
        gap: 12px;
      }

      .hero__image-frame {
        width: min(100%, 700px);
        max-height: 64svh;
      }

      .hero__message {
        max-width: 500px;
      }
    }

    @media (max-width: 640px) {
      .page {
        min-height: 620px;
      }

      .hero {
        padding:
          max(12px, env(safe-area-inset-top))
          8px
          max(12px, env(safe-area-inset-bottom));
      }

      .hero__container {
        gap: 9px;
      }

      .hero__eyebrow {
        margin-bottom: 5px;
        font-size: 7px;
        letter-spacing: 0.2em;
      }

      .hero__eyebrow::before,
      .hero__eyebrow::after {
        width: 18px;
      }

      .hero__title {
        font-size: clamp(32px, 10.7vw, 48px);
      }

      .hero__script {
        margin-top: 1px;
        font-size: clamp(25px, 8.2vw, 38px);
      }

      .hero__message {
        max-width: 340px;
        margin-top: 4px;
        font-size: 11px;
        line-height: 1.42;
      }

      .hero__image-frame {
        width: min(100%, 460px);
        max-height: 62svh;
        border-radius: 18px;
      }

      .hero__footer {
        font-size: 7px;
        letter-spacing: 0.15em;
      }

      .heart:nth-child(n + 7),
      .sparkle:nth-child(n + 11) {
        display: none;
      }
    }

    @media (max-height: 720px) and (min-width: 641px) {
      .hero__eyebrow {
        margin-bottom: 5px;
      }

      .hero__title {
        font-size: clamp(34px, 4.8vw, 64px);
      }

      .hero__script {
        font-size: clamp(27px, 3.4vw, 44px);
      }

      .hero__message {
        margin-top: 5px;
        font-size: 12px;
      }

      .hero__image-frame {
        max-height: 58svh;
      }

      .hero__container {
        gap: 8px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .heart,
      .sparkle,
      .hero__lightning,
      .hero__glow {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="effects" aria-hidden="true">
      <span class="heart" style="left: 6%; --size: 14px; --duration: 12s; --delay: -2s; --drift: 45px;"></span>
      <span class="heart" style="left: 16%; --size: 10px; --duration: 10s; --delay: -6s; --drift: -32px;"></span>
      <span class="heart" style="left: 28%; --size: 18px; --duration: 15s; --delay: -8s; --drift: 58px;"></span>
      <span class="heart" style="left: 44%; --size: 11px; --duration: 11s; --delay: -3s; --drift: -42px;"></span>
      <span class="heart" style="left: 62%; --size: 16px; --duration: 14s; --delay: -10s; --drift: 36px;"></span>
      <span class="heart" style="left: 76%; --size: 12px; --duration: 12s; --delay: -5s; --drift: -48px;"></span>
      <span class="heart" style="left: 88%; --size: 19px; --duration: 16s; --delay: -11s; --drift: 28px;"></span>
      <span class="heart" style="left: 95%; --size: 9px; --duration: 10s; --delay: -7s; --drift: -24px;"></span>

      <span class="sparkle" style="left: 8%; top: 12%; --size: 3px; --duration: 3.1s; --delay: -1s;"></span>
      <span class="sparkle" style="left: 18%; top: 35%; --size: 2px; --duration: 2.6s; --delay: -2s;"></span>
      <span class="sparkle" style="left: 30%; top: 18%; --size: 4px; --duration: 3.4s; --delay: -1.4s;"></span>
      <span class="sparkle" style="left: 39%; top: 70%; --size: 2px; --duration: 2.8s; --delay: -2.2s;"></span>
      <span class="sparkle" style="left: 50%; top: 10%; --size: 3px; --duration: 3.2s; --delay: -0.8s;"></span>
      <span class="sparkle" style="left: 59%; top: 42%; --size: 2px; --duration: 2.7s; --delay: -1.8s;"></span>
      <span class="sparkle" style="left: 70%; top: 20%; --size: 4px; --duration: 3.5s; --delay: -2.6s;"></span>
      <span class="sparkle" style="left: 80%; top: 60%; --size: 2px; --duration: 2.5s; --delay: -1.1s;"></span>
      <span class="sparkle" style="left: 91%; top: 30%; --size: 3px; --duration: 3s; --delay: -2.3s;"></span>
      <span class="sparkle" style="left: 14%; top: 80%; --size: 3px; --duration: 3.3s; --delay: -1.5s;"></span>
      <span class="sparkle" style="left: 84%; top: 86%; --size: 4px; --duration: 3.6s; --delay: -2.7s;"></span>
    </div>

    <section class="hero" aria-labelledby="hero-title">
      <div class="hero__container">
        <header class="hero__header">
          <p class="hero__eyebrow">A Love Worth Celebrating</p>

          <h1 class="hero__title" id="hero-title">
            Happy Anniversary
          </h1>

          <p class="hero__script">
            To my beautiful girl
          </p>

          <p class="hero__message">
            Every moment with you is my favorite, and every memory we create
            becomes another beautiful part of the life I always want to share with you.
          </p>
        </header>

        <div class="hero__image-stage">
          <div class="hero__glow" aria-hidden="true"></div>

          <div class="hero__image-frame">
            <div class="hero__lightning" aria-hidden="true"></div>

            <img
              class="hero__image"
              src="https://raw.githubusercontent.com/Friedazebalili/anniversary/1cee58e2b08a23aad86acdddce2020f1679450bb/assets/anniversary.png"
              alt="A romantic anniversary collage featuring the couple and portraits"
              width="1122"
              height="1402"
              fetchpriority="high"
              decoding="async"
            >
          </div>
        </div>

        <div class="hero__footer" aria-hidden="true">
          <span class="hero__footer-dot"></span>
          <span>Made with all my love</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
