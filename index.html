<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7dfe8">
  <meta name="description" content="A beautiful anniversary message made with love.">
  <title>Happy Anniversary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main>
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="hero__image-wrapper">
        <img
          class="hero__image"
          src="assets/anniversary-collage.png"
          alt="Romantic anniversary collage featuring the couple"
          width="1122"
          height="1402"
          fetchpriority="high"
          decoding="async"
        >

        <div class="hero__overlay" aria-hidden="true"></div>

        <div class="hero__content">
          <p class="hero__eyebrow">A LOVE WORTH CELEBRATING</p>

          <h1 class="hero__title" id="hero-title">
            <span class="hero__title-line">Happy</span>
            <span class="hero__title-line hero__title-line--large">Anniversary</span>
          </h1>

          <p class="hero__script">To my beautiful girl</p>

          <p class="hero__message">
            Every moment with you is my favorite.
          </p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
