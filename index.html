<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120810">
  <meta name="description" content="A romantic anniversary experience made with love.">
  <title>Happy Anniversary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #090407;
      --white: #fff9fc;
      --muted: rgba(255, 241, 247, 0.78);
      --pink: #ffb7d1;
      --pink-soft: #ffd8e6;
      --pink-strong: #ff5fa2;
      --pink-glow: rgba(255, 116, 181, 0.45);
      --border: rgba(255, 235, 243, 0.18);
      --shadow: rgba(0, 0, 0, 0.58);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --image-ratio: 1122 / 1402;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-width: 320px;
      height: 100%;
      overflow: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 50% -8%, rgba(229, 127, 170, 0.22), transparent 34%),
        radial-gradient(circle at 12% 70%, rgba(122, 42, 85, 0.14), transparent 30%),
        radial-gradient(circle at 88% 68%, rgba(245, 152, 190, 0.12), transparent 30%),
        linear-gradient(180deg, #1c0d19 0%, #10070e 48%, #080407 100%);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .page {
      position: relative;
      width: 100%;
      height: 100svh;
      min-height: 600px;
      overflow: hidden;
      isolation: isolate;
    }

    .page::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -5;
      background:
        radial-gradient(circle at 50% 15%, rgba(255, 185, 217, 0.07), transparent 24%),
        linear-gradient(120deg, rgba(255, 255, 255, 0.022), transparent 28%, transparent 70%, rgba(255, 255, 255, 0.018));
    }

    .page::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      z-index: -4;
      height: 30%;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(4, 2, 4, 0.55));
    }

    .ambient-blur {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -3;
      overflow: hidden;
    }

    .ambient-blur span {
      position: absolute;
      border-radius: 999px;
      filter: blur(70px);
      opacity: 0.45;
      animation: ambientFloat linear infinite;
    }

    .ambient-blur span:nth-child(1) {
      width: 280px;
      height: 280px;
      left: -60px;
      top: 10%;
      background: rgba(255, 118, 183, 0.18);
      animation-duration: 14s;
    }

    .ambient-blur span:nth-child(2) {
      width: 240px;
      height: 240px;
      right: -40px;
      top: 18%;
      background: rgba(255, 182, 213, 0.15);
      animation-duration: 18s;
      animation-direction: reverse;
    }

    .ambient-blur span:nth-child(3) {
      width: 320px;
      height: 320px;
      left: 50%;
      bottom: -80px;
      transform: translateX(-50%);
      background: rgba(239, 104, 172, 0.14);
      animation-duration: 16s;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100%;
      padding:
        max(14px, env(safe-area-inset-top))
        max(18px, env(safe-area-inset-right))
        max(12px, env(safe-area-inset-bottom))
        max(18px, env(safe-area-inset-left));
    }

    .hero__container {
      position: relative;
      width: min(1240px, 100%);
      height: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      align-items: center;
      justify-items: center;
      gap: clamp(8px, 1.4vh, 14px);
    }

    .hero__header {
      position: relative;
      z-index: 8;
      width: min(920px, 100%);
      margin: 0 auto;
      text-align: center;
      animation: headerReveal 1s var(--ease) both;
    }

    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 6px;
      color: rgba(255, 233, 242, 0.67);
      font-size: 9px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .hero__eyebrow::before,
    .hero__eyebrow::after {
      content: "";
      width: clamp(20px, 4vw, 58px);
      height: 1px;
    }

    .hero__eyebrow::before {
      background: linear-gradient(90deg, transparent, rgba(255, 220, 234, 0.5));
    }

    .hero__eyebrow::after {
      background: linear-gradient(90deg, rgba(255, 220, 234, 0.5), transparent);
    }

    .hero__title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(38px, 5.5vw, 82px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      color: transparent;
      background: linear-gradient(105deg, #754759 0%, #f5d4df 12%, #ffffff 22%, #a96e84 34%, #fff0f5 47%, #965d71 59%, #ffffff 72%, #d9a5b5 85%, #744557 100%);
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.12);
      filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.42));
      animation: chromeShine 8s 1.2s ease-in-out infinite;
    }

    .hero__script {
      margin: 2px 0 0;
      color: var(--pink-soft);
      font-family: "Great Vibes", cursive;
      font-size: clamp(28px, 4vw, 54px);
      font-weight: 400;
      line-height: 1;
      text-shadow: 0 7px 22px rgba(0, 0, 0, 0.42), 0 0 20px rgba(255, 178, 207, 0.15);
    }

    .hero__message {
      max-width: 580px;
      margin: 7px auto 0;
      color: var(--muted);
      font-size: clamp(12px, 1.15vw, 15px);
      font-weight: 300;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    .hero__image-stage {
      position: relative;
      z-index: 5;
      width: 100%;
      height: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: imageReveal 1.2s 0.12s var(--ease) both;
    }

    .hero__glow {
      position: absolute;
      width: min(80vw, 760px);
      height: 84%;
      z-index: -3;
      border-radius: 46%;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(255, 177, 208, 0.3), rgba(210, 95, 146, 0.12) 46%, transparent 76%);
      filter: blur(50px);
      opacity: 0.92;
      animation: glowPulse 4.8s ease-in-out infinite;
    }

    .hero__float-wrap {
      position: relative;
      display: inline-block;
      animation: heroBounce 5.6s ease-in-out infinite;
      will-change: transform;
    }

    .hero__image-frame {
      position: relative;
      height: min(68svh, 760px);
      width: auto;
      max-width: 100%;
      aspect-ratio: var(--image-ratio);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: clamp(20px, 2.4vw, 36px);
      background: #10070e;
      box-shadow:
        0 32px 90px var(--shadow),
        0 0 0 1px rgba(255, 255, 255, 0.035),
        0 0 60px rgba(231, 136, 176, 0.15);
      transform: translateZ(0);
    }

    .hero__image-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.09),
        inset 0 0 70px rgba(0, 0, 0, 0.12);
    }

    .hero__image-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 3;
      border-radius: inherit;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(10, 4, 9, 0.01), transparent 60%, rgba(7, 3, 6, 0.1));
    }

    .hero__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.8s var(--ease);
    }

    .hero__image-frame:hover .hero__image {
      transform: scale(1.015);
    }

    .hero__lightning {
      position: absolute;
      inset: -2px;
      z-index: 4;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0.72;
      box-shadow:
        0 0 12px rgba(255, 91, 160, 0.9),
        0 0 28px rgba(255, 95, 164, 0.5),
        inset 0 0 14px rgba(255, 102, 168, 0.16);
      animation: lightningPulse 2.4s ease-in-out infinite;
    }

    .hero__lightning::before,
    .hero__lightning::after {
      content: "";
      position: absolute;
      border-radius: inherit;
      pointer-events: none;
    }

    .hero__lightning::before {
      inset: 0;
      border: 1px solid rgba(255, 121, 180, 0.35);
      box-shadow:
        0 0 18px rgba(255, 99, 166, 0.45),
        0 0 38px rgba(255, 99, 166, 0.22);
    }

    .hero__lightning::after {
      inset: 14px;
      border-radius: 22px;
      border: 1px dashed rgba(255, 176, 213, 0.18);
      opacity: 0.6;
      animation: innerPulse 3s ease-in-out infinite;
    }

    .hero__stickers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 6;
    }

    .sticker {
      position: absolute;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #ffd7e8;
      text-shadow:
        0 0 12px rgba(255, 112, 173, 0.65),
        0 0 28px rgba(255, 112, 173, 0.45);
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.26));
      user-select: none;
    }

    .sticker--heart1 {
      top: 7%;
      left: -4.8%;
      font-size: clamp(20px, 2.2vw, 30px);
      animation: stickerFloatA 4.8s ease-in-out infinite;
    }

    .sticker--heart2 {
      top: 17%;
      right: -4%;
      font-size: clamp(18px, 2vw, 28px);
      animation: stickerFloatB 5.2s ease-in-out infinite;
    }

    .sticker--spark {
      bottom: 10%;
      left: -4.2%;
      font-size: clamp(22px, 2vw, 30px);
      animation: stickerFloatC 4.6s ease-in-out infinite;
    }

    .sticker--bolt {
      bottom: 15%;
      right: -4.6%;
      font-size: clamp(20px, 2vw, 30px);
      color: #ff9bcc;
      animation: stickerFloatD 4.9s ease-in-out infinite;
    }

    .hero__footer {
      position: relative;
      z-index: 8;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: rgba(255, 237, 244, 0.54);
      font-size: 9px;
      font-weight: 500;
      line-height: 1.2;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: footerReveal 0.9s 0.55s var(--ease) both;
    }

    .hero__footer-dot {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 13px rgba(247, 190, 210, 0.85);
    }

    .effects {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow: hidden;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      width: var(--size);
      height: var(--size);
      opacity: 0;
      transform: rotate(45deg);
      background: linear-gradient(135deg, rgba(255, 204, 225, 0.96), rgba(255, 89, 157, 0.86));
      filter: drop-shadow(0 0 10px rgba(255, 100, 164, 0.65));
      animation: heartFloat var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .heart::before {
      left: -50%;
      top: 0;
    }

    .heart::after {
      left: 0;
      top: -50%;
    }

    .sparkle {
      position: absolute;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background: rgba(255, 232, 242, 0.95);
      box-shadow:
        0 0 7px rgba(255, 208, 226, 0.95),
        0 0 14px rgba(255, 114, 171, 0.5);
      animation: sparkleTwinkle var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .bubble {
      position: absolute;
      bottom: -60px;
      width: var(--size);
      height: var(--size);
      border-radius: 50%;
      background:
        radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0.05) 28%, rgba(255, 182, 214, 0.24) 70%, rgba(255, 130, 188, 0.1) 100%);
      border: 1px solid rgba(255, 215, 231, 0.16);
      box-shadow:
        inset 0 0 12px rgba(255, 255, 255, 0.1),
        0 0 18px rgba(255, 128, 186, 0.18);
      opacity: 0;
      animation: bubbleFloat var(--duration) linear infinite;
      animation-delay: var(--delay);
    }

    .twinkle-cross {
      position: absolute;
      width: var(--size);
      height: var(--size);
      opacity: 0.8;
      animation: crossBlink var(--duration) ease-in-out infinite;
      animation-delay: var(--delay);
    }

    .twinkle-cross::before,
    .twinkle-cross::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 50%;
      background: linear-gradient(180deg, rgba(255, 244, 248, 0), rgba(255, 218, 232, 1), rgba(255, 244, 248, 0));
      transform: translate(-50%, -50%);
      border-radius: 999px;
      box-shadow: 0 0 10px rgba(255, 190, 219, 0.5);
    }

    .twinkle-cross::before {
      width: 2px;
      height: 100%;
    }

    .twinkle-cross::after {
      width: 100%;
      height: 2px;
    }

    @keyframes headerReveal {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes imageReveal {
      from {
        opacity: 0;
        transform: translateY(26px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes footerReveal {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes chromeShine {
      0%, 18% {
        background-position: 115% 50%;
      }
      48%, 100% {
        background-position: -115% 50%;
      }
    }

    @keyframes glowPulse {
      0%, 100% {
        opacity: 0.62;
        transform: scale(0.97);
      }
      50% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    @keyframes heroBounce {
      0%, 100% {
        transform: translateY(0);
      }
      25% {
        transform: translateY(-8px);
      }
      50% {
        transform: translateY(-14px);
      }
      75% {
        transform: translateY(-7px);
      }
    }

    @keyframes lightningPulse {
      0%, 100% {
        opacity: 0.34;
        filter: brightness(0.92);
      }
      10% {
        opacity: 0.96;
        filter: brightness(1.52);
      }
      16% {
        opacity: 0.42;
      }
      22% {
        opacity: 1;
        filter: brightness(1.75);
      }
      48% {
        opacity: 0.52;
      }
      72% {
        opacity: 0.88;
        filter: brightness(1.36);
      }
    }

    @keyframes innerPulse {
      0%, 100% {
        opacity: 0.22;
        transform: scale(1);
      }
      50% {
        opacity: 0.5;
        transform: scale(0.99);
      }
    }

    @keyframes heartFloat {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) rotate(45deg) scale(0.7);
      }
      10% {
        opacity: 0.72;
      }
      55% {
        opacity: 0.5;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), -115vh, 0) rotate(405deg) scale(1.1);
      }
    }

    @keyframes bubbleFloat {
      0% {
        opacity: 0;
        transform: translate3d(0, 0, 0) scale(0.65);
      }
      12% {
        opacity: 0.55;
      }
      60% {
        opacity: 0.35;
      }
      100% {
        opacity: 0;
        transform: translate3d(var(--drift), -105vh, 0) scale(1.08);
      }
    }

    @keyframes sparkleTwinkle {
      0%, 100% {
        opacity: 0.15;
        transform: scale(0.7);
      }
      50% {
        opacity: 1;
        transform: scale(1.4);
      }
    }

    @keyframes crossBlink {
      0%, 100% {
        opacity: 0.24;
        transform: scale(0.7) rotate(0deg);
      }
      50% {
        opacity: 1;
        transform: scale(1.15) rotate(15deg);
      }
    }

    @keyframes stickerFloatA {
      0%, 100% { transform: translateY(0) rotate(-8deg) scale(1); }
      50% { transform: translateY(-10px) rotate(6deg) scale(1.08); }
    }

    @keyframes stickerFloatB {
      0%, 100% { transform: translateY(0) rotate(6deg) scale(1); }
      50% { transform: translateY(-12px) rotate(-8deg) scale(1.07); }
    }

    @keyframes stickerFloatC {
      0%, 100% { transform: translateY(0) rotate(-4deg) scale(1); }
      50% { transform: translateY(-9px) rotate(10deg) scale(1.06); }
    }

    @keyframes stickerFloatD {
      0%, 100% { transform: translateY(0) rotate(5deg) scale(1); }
      50% { transform: translateY(-11px) rotate(-10deg) scale(1.08); }
    }

    @keyframes ambientFloat {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(20px, -18px, 0) scale(1.06);
      }
    }

    @media (max-width: 900px) {
      .page {
        min-height: 640px;
      }

      .hero {
        padding-left: 12px;
        padding-right: 12px;
      }

      .hero__image-frame {
        height: min(64svh, 680px);
      }

      .sticker--heart1,
      .sticker--heart2,
      .sticker--spark,
      .sticker--bolt {
        font-size: 20px;
      }
    }

    @media (max-width: 640px) {
      .page {
        min-height: 620px;
      }

      .hero {
        padding:
          max(10px, env(safe-area-inset-top))
          8px
          max(10px, env(safe-area-inset-bottom));
      }

      .hero__container {
        gap: 7px;
      }

      .hero__eyebrow {
        margin-bottom: 4px;
        font-size: 7px;
        letter-spacing: 0.2em;
      }

      .hero__eyebrow::before,
      .hero__eyebrow::after {
        width: 18px;
      }

      .hero__title {
        font-size: clamp(32px, 10.7vw, 48px);
      }

      .hero__script {
        margin-top: 1px;
        font-size: clamp(25px, 8.2vw, 38px);
      }

      .hero__message {
        max-width: 340px;
        margin-top: 4px;
        font-size: 11px;
        line-height: 1.4;
      }

      .hero__image-frame {
        height: min(61svh, 560px);
        max-width: 100%;
        border-radius: 18px;
      }

      .hero__footer {
        font-size: 7px;
        letter-spacing: 0.15em;
      }

      .heart:nth-child(n + 7),
      .sparkle:nth-child(n + 9),
      .bubble:nth-child(n + 6),
      .twinkle-cross:nth-child(n + 5) {
        display: none;
      }

      .sticker--heart1,
      .sticker--heart2,
      .sticker--spark,
      .sticker--bolt {
        font-size: 17px;
      }

      .sticker--heart1 {
        left: -2%;
      }

      .sticker--heart2 {
        right: -2%;
      }

      .sticker--spark {
        left: -1.5%;
      }

      .sticker--bolt {
        right: -2%;
      }
    }

    @media (max-height: 720px) and (min-width: 641px) {
      .hero__eyebrow {
        margin-bottom: 3px;
      }

      .hero__title {
        font-size: clamp(34px, 4.8vw, 64px);
      }

      .hero__script {
        font-size: clamp(27px, 3.4vw, 44px);
      }

      .hero__message {
        margin-top: 4px;
        font-size: 12px;
      }

      .hero__image-frame {
        height: min(57svh, 600px);
      }

      .hero__container {
        gap: 6px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }

      .heart,
      .sparkle,
      .bubble,
      .twinkle-cross,
      .hero__lightning,
      .hero__glow,
      .sticker,
      .ambient-blur {
        display: none;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <div class="ambient-blur" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="effects" aria-hidden="true">
      <span class="heart" style="left: 6%; --size: 14px; --duration: 12s; --delay: -2s; --drift: 45px;"></span>
      <span class="heart" style="left: 16%; --size: 10px; --duration: 10s; --delay: -6s; --drift: -32px;"></span>
      <span class="heart" style="left: 28%; --size: 18px; --duration: 15s; --delay: -8s; --drift: 58px;"></span>
