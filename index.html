<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12080f">
  <meta name="description" content="A romantic anniversary experience made with love.">
  <title>Happy Anniversary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #0d060c;
      --background-soft: #1b0c18;
      --white: #fff8fb;
      --soft-white: rgba(255, 244, 248, 0.74);
      --pink: #f7bfd3;
      --light-pink: #ffe0eb;
      --border: rgba(255, 237, 244, 0.16);
      --shadow: rgba(0, 0, 0, 0.58);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --page-width: 1180px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      background: var(--background);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 50% 0%, rgba(231, 139, 179, 0.18), transparent 34%),
        radial-gradient(circle at 12% 65%, rgba(167, 67, 115, 0.11), transparent 28%),
        radial-gradient(circle at 88% 60%, rgba(239, 164, 194, 0.1), transparent 30%),
        linear-gradient(180deg, #1c0d19 0%, #10080f 48%, #090508 100%);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      padding:
        max(34px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(34px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 50% 24%, rgba(255, 218, 232, 0.07), transparent 27%),
        linear-gradient(145deg, rgba(42, 18, 37, 0.7), rgba(9, 4, 8, 0.9));
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      z-index: -2;
      height: 35%;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(6, 3, 5, 0.52));
    }

    .hero__shell {
      width: min(var(--page-width), 100%);
      min-height: calc(100svh - 68px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 3vw, 40px);
    }

    .hero__header {
      position: relative;
      z-index: 3;
      width: min(940px, 100%);
      text-align: center;
      animation: headerReveal 1s var(--ease) both;
    }

    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 14px;
      color: rgba(255, 235, 243, 0.68);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.31em;
      text-transform: uppercase;
    }

    .hero__eyebrow::before,
    .hero__eyebrow::after {
      content: "";
      width: clamp(26px, 5vw, 66px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 221, 234, 0.48));
    }

    .hero__eyebrow::after {
      background: linear-gradient(90deg, rgba(255, 221, 234, 0.48), transparent);
    }

    .hero__title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(48px, 7vw, 104px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      color: transparent;
      background:
        linear-gradient(
          105deg,
          #7d4c60 0%,
          #f6d7e2 12%,
          #ffffff 22%,
          #aa7187 34%,
          #fff0f5 48%,
          #986175 60%,
          #ffffff 73%,
          #d9a7b8 86%,
          #75475a 100%
        );
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.13);
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.42));
      animation: chromeShine 8s 1.4s ease-in-out infinite;
    }

    .hero__script {
      margin: 9px 0 0;
      color: var(--light-pink);
      font-family: "Great Vibes", cursive;
      font-size: clamp(34px, 5vw, 68px);
      font-weight: 400;
      line-height: 1;
      text-shadow:
        0 8px 24px rgba(0, 0, 0, 0.42),
        0 0 22px rgba(255, 177, 207, 0.14);
    }

    .hero__message {
      max-width: 610px;
      margin: 16px auto 0;
      color: var(--soft-white);
      font-size: clamp(14px, 1.4vw, 18px);
      font-weight: 300;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .hero__image-stage {
      position: relative;
      width: 100%;
      display: flex;
      justify-content: center;
      animation: imageReveal 1.2s 0.15s var(--ease) both;
    }

    .hero__glow {
      position: absolute;
      inset: 8% 7% -4%;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 183, 211, 0.26),
        rgba(208, 104, 151, 0.1) 46%,
        transparent 75%
      );
      filter: blur(50px);
    }

    .hero__image-frame {
      position: relative;
      width: min(100%, 1050px);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: clamp(22px, 2.6vw, 38px);
      background: #10080e;
      box-shadow:
        0 42px 110px var(--shadow),
        0 0 0 1px rgba(255, 255, 255, 0.035),
        0 0 68px rgba(231, 136, 176, 0.13);
      transform: translateZ(0);
    }

    .hero__image-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.09),
        inset 0 0 70px rgba(0, 0, 0, 0.12);
    }

    .hero__image-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(
          180deg,
          rgba(10, 4, 9, 0.02),
          transparent 60%,
          rgba(7, 3, 6, 0.12)
        );
    }

    .hero__image {
      width: 100%;
      height: auto;
      object-fit: contain;
      object-position: center;
      transition: transform 0.8s var(--ease);
    }

    .hero__image-frame:hover .hero__image {
      transform: scale(1.012);
    }

    .hero__footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      color: rgba(255, 238, 244, 0.54);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: footerReveal 0.9s 0.55s var(--ease) both;
    }

    .hero__footer-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 13px rgba(247, 190, 210, 0.85);
    }

    @keyframes headerReveal {
      from {
        opacity: 0;
        transform: translateY(-22px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes imageReveal {
      from {
        opacity: 0;
        transform: translateY(30px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes footerReveal {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes chromeShine {
      0%,
      18% {
        background-position: 115% 50%;
      }

      48%,
      100% {
        background-position: -115% 50%;
      }
    }

    @media (max-width: 900px) {
      .hero {
        padding-left: 15px;
        padding-right: 15px;
      }

      .hero__shell {
        min-height: auto;
        justify-content: flex-start;
      }

      .hero__header {
        padding-top: 8px;
      }

      .hero__image-frame {
        width: min(100%, 760px);
        border-radius: 25px;
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding:
          max(23px, env(safe-area-inset-top))
          10px
          max(23px, env(safe-area-inset-bottom));
      }

      .hero__shell {
        gap: 21px;
      }

      .hero__header {
        padding-inline: 7px;
      }

      .hero__eyebrow {
        margin-bottom: 10px;
        font-size: 8px;
        letter-spacing: 0.22em;
      }

      .hero__title {
        font-size: clamp(38px, 12vw, 59px);
        line-height: 0.93;
      }

      .hero__script {
        margin-top: 7px;
        font-size: clamp(31px, 10vw, 45px);
      }

      .hero__message {
        max-width: 350px;
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.55;
      }

      .hero__image-frame {
        width: 100%;
        border-radius: 18px;
      }

      .hero__image {
        width: 100%;
        height: auto;
        object-fit: contain;
      }

      .hero__footer {
        font-size: 8px;
        letter-spacing: 0.16em;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="hero__shell">
        <header class="hero__header">
          <p class="hero__eyebrow">A Love Worth Celebrating</p>

          <h1 class="hero__title" id="hero-title">
            Happy Anniversary
          </h1>

          <p class="hero__script">
            To my beautiful girl
          </p>

          <p class="hero__message">
            Every moment with you is my favorite, and every memory we create
            becomes another part of the life I always want to share with you.
          </p>
        </header>

        <div class="hero__image-stage">
          <div class="hero__glow" aria-hidden="true"></div>

          <div class="hero__image-frame">
            <img
              class="hero__image"
              src="anniversary.png"
              alt="A romantic anniversary collage featuring the couple and portraits"
              width="1122"
              height="1402"
              fetchpriority="high"
              decoding="async"
            >
          </div>
        </div>

        <div class="hero__footer" aria-hidden="true">
          <span class="hero__footer-dot"></span>
          <span>Made with all my love</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
