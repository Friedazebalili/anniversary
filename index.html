<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#11080f">
  <meta name="description" content="A romantic anniversary experience made with love.">
  <title>Happy Anniversary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #0e070d;
      --background-soft: #1b0d18;
      --white: #fff9fb;
      --muted: rgba(255, 242, 248, 0.72);
      --pink: #f7bed2;
      --light-pink: #ffe0eb;
      --rose-gold: #ddb0a5;
      --border: rgba(255, 238, 245, 0.14);
      --shadow: rgba(0, 0, 0, 0.55);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --page-width: 1500px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--background);
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 50% 0%, rgba(231, 145, 181, 0.18), transparent 32%),
        linear-gradient(180deg, #1c0d19 0%, var(--background) 65%);
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      padding:
        max(34px, env(safe-area-inset-top))
        max(22px, env(safe-area-inset-right))
        max(34px, env(safe-area-inset-bottom))
        max(22px, env(safe-area-inset-left));
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        radial-gradient(circle at 18% 20%, rgba(255, 215, 230, 0.08), transparent 25%),
        radial-gradient(circle at 82% 62%, rgba(197, 96, 142, 0.11), transparent 32%),
        linear-gradient(145deg, #180b16, #0c060b 72%);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      z-index: -2;
      height: 42%;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(6, 3, 6, 0.48));
    }

    .hero__shell {
      width: min(var(--page-width), 100%);
      min-height: calc(100svh - 68px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(24px, 3vw, 42px);
    }

    .hero__header {
      position: relative;
      z-index: 5;
      width: min(1080px, 100%);
      text-align: center;
      animation: headerEntrance 1s var(--ease) both;
    }

    .hero__eyebrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 0 15px;
      color: rgba(255, 234, 242, 0.68);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.32em;
      text-transform: uppercase;
    }

    .hero__eyebrow::before,
    .hero__eyebrow::after {
      content: "";
      width: clamp(24px, 5vw, 70px);
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 222, 235, 0.5));
    }

    .hero__eyebrow::after {
      background: linear-gradient(90deg, rgba(255, 222, 235, 0.5), transparent);
    }

    .hero__title {
      margin: 0;
      font-family: "Playfair Display", serif;
      font-size: clamp(47px, 7vw, 112px);
      font-weight: 500;
      line-height: 0.9;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      color: transparent;
      background:
        linear-gradient(
          105deg,
          #8f596d 0%,
          #f9dce6 13%,
          #ffffff 22%,
          #b88194 34%,
          #fff0f5 47%,
          #986075 60%,
          #ffffff 74%,
          #d8a7b7 86%,
          #815064 100%
        );
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.13);
      filter: drop-shadow(0 10px 28px rgba(0, 0, 0, 0.4));
      animation: chromeShine 8s 1.5s ease-in-out infinite;
    }

    .hero__script {
      margin: 8px 0 0;
      color: var(--light-pink);
      font-family: "Great Vibes", cursive;
      font-size: clamp(35px, 5vw, 72px);
      font-weight: 400;
      line-height: 1;
      text-shadow:
        0 8px 24px rgba(0, 0, 0, 0.38),
        0 0 22px rgba(255, 169, 203, 0.15);
    }

    .hero__message {
      max-width: 620px;
      margin: 16px auto 0;
      color: var(--muted);
      font-size: clamp(14px, 1.4vw, 18px);
      font-weight: 300;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }

    .hero__image-stage {
      position: relative;
      width: 100%;
      animation: imageEntrance 1.25s 0.15s var(--ease) both;
    }

    .hero__glow {
      position: absolute;
      inset: 10% 4% -4%;
      z-index: -1;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        ellipse at center,
        rgba(255, 183, 211, 0.27),
        rgba(210, 107, 153, 0.11) 44%,
        transparent 75%
      );
      filter: blur(50px);
    }

    .hero__image-frame {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: clamp(22px, 2.5vw, 40px);
      background: #140a12;
      box-shadow:
        0 44px 115px var(--shadow),
        0 0 0 1px rgba(255, 255, 255, 0.035),
        0 0 70px rgba(231, 138, 177, 0.13);
      transform: translateZ(0);
    }

    .hero__image-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.1),
        inset 0 0 80px rgba(0, 0, 0, 0.12);
    }

    .hero__image-frame::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      border-radius: inherit;
      background:
        linear-gradient(
          180deg,
          rgba(12, 5, 11, 0.03),
          transparent 55%,
          rgba(8, 3, 7, 0.15)
        );
    }

    .hero__image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center center;
      transform: scale(1.002);
      transition: transform 0.8s var(--ease);
    }

    .hero__image-frame:hover .hero__image {
      transform: scale(1.018);
    }

    .hero__footer {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: rgba(255, 238, 244, 0.55);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: footerEntrance 0.9s 0.65s var(--ease) both;
    }

    .hero__footer-dot {
      width: 5px;
      height: 5px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 13px rgba(247, 190, 210, 0.85);
    }

    @keyframes headerEntrance {
      from {
        opacity: 0;
        transform: translateY(-24px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes imageEntrance {
      from {
        opacity: 0;
        transform: translateY(34px) scale(0.975);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes footerEntrance {
      from {
        opacity: 0;
        transform: translateY(15px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes chromeShine {
      0%,
      18% {
        background-position: 115% 50%;
      }

      48%,
      100% {
        background-position: -115% 50%;
      }
    }

    @media (max-width: 900px) {
      .hero {
        padding-left: 16px;
        padding-right: 16px;
      }

      .hero__shell {
        min-height: auto;
        justify-content: flex-start;
      }

      .hero__header {
        padding-top: 12px;
      }

      .hero__image-frame {
        border-radius: 25px;
      }
    }

    @media (max-width: 640px) {
      .hero {
        padding:
          max(24px, env(safe-area-inset-top))
          10px
          max(24px, env(safe-area-inset-bottom));
      }

      .hero__shell {
        gap: 22px;
      }

      .hero__header {
        padding-inline: 8px;
      }

      .hero__eyebrow {
        margin-bottom: 11px;
        font-size: 8px;
        letter-spacing: 0.22em;
      }

      .hero__title {
        font-size: clamp(38px, 12vw, 60px);
        line-height: 0.93;
      }

      .hero__script {
        margin-top: 7px;
        font-size: clamp(31px, 10vw, 46px);
      }

      .hero__message {
        max-width: 350px;
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.55;
      }

      .hero__image-frame {
        min-height: 230px;
        aspect-ratio: 16 / 9;
        border-radius: 18px;
      }

      .hero__image {
        object-position: center center;
      }

      .hero__footer {
        font-size: 8px;
        letter-spacing: 0.16em;
      }
    }

    @media (max-width: 420px) {
      .hero__image-frame {
        min-height: 215px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="hero__shell">
        <header class="hero__header">
          <p class="hero__eyebrow">A Love Worth Celebrating</p>

          <h1 class="hero__title" id="hero-title">
            Happy Anniversary
          </h1>

          <p class="hero__script">
            To my beautiful girl
          </p>

          <p class="hero__message">
            Every moment with you is my favorite, and every memory we create
            becomes another part of the life I always want to share with you.
          </p>
        </header>

        <div class="hero__image-stage">
          <div class="hero__glow" aria-hidden="true"></div>

          <div class="hero__image-frame">
            <img
              class="hero__image"
              src="assets/anniversary-collage.png"
              alt="A romantic anniversary collage featuring the couple and portraits"
              width="1792"
              height="1024"
              fetchpriority="high"
              decoding="async"
            >
          </div>
        </div>

        <div class="hero__footer" aria-hidden="true">
          <span class="hero__footer-dot"></span>
          <span>Made with all my love</span>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
