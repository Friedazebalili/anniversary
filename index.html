<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a0d17">
  <meta name="description" content="A beautiful anniversary message made with love.">
  <title>Happy Anniversary</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --background: #110910;
      --background-soft: #1b0e18;
      --white: #fff8fb;
      --soft-white: rgba(255, 248, 251, 0.78);
      --pink: #f3b8cc;
      --light-pink: #ffd7e5;
      --rose-gold: #d6a092;
      --border: rgba(255, 255, 255, 0.16);
      --shadow: rgba(0, 0, 0, 0.45);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 50% 10%, rgba(231, 150, 184, 0.22), transparent 34%),
        linear-gradient(180deg, var(--background-soft), var(--background));
      font-family: "DM Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img {
      display: block;
      max-width: 100%;
    }

    .hero {
      position: relative;
      min-height: 100svh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 24px;
      isolation: isolate;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 20% 20%, rgba(255, 212, 228, 0.12), transparent 28%),
        radial-gradient(circle at 80% 78%, rgba(202, 115, 151, 0.14), transparent 32%),
        linear-gradient(135deg, #160b14 0%, #25101f 48%, #10080f 100%);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto 0 0;
      z-index: 3;
      height: 30%;
      pointer-events: none;
      background: linear-gradient(180deg, transparent, rgba(10, 5, 9, 0.68));
    }

    .hero__shell {
      position: relative;
      width: min(1240px, 100%);
      min-height: calc(100svh - 48px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero__glow {
      position: absolute;
      width: min(90vw, 900px);
      height: min(90vw, 900px);
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 191, 216, 0.23) 0%,
        rgba(216, 120, 160, 0.1) 42%,
        transparent 72%
      );
      filter: blur(44px);
      animation: glowPulse 7s ease-in-out infinite;
    }

    .hero__card {
      position: relative;
      width: min(720px, 100%);
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 34px;
      background: rgba(255, 255, 255, 0.05);
      box-shadow:
        0 40px 110px var(--shadow),
        0 0 60px rgba(239, 160, 194, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.12);
      animation: cardEntrance 1.4s var(--ease) both;
    }

    .hero__image-wrapper {
      position: relative;
      width: 100%;
      min-height: min(88svh, 900px);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #170c15;
    }

    .hero__image {
      width: 100%;
      height: 100%;
      max-height: min(88svh, 900px);
      object-fit: contain;
      object-position: center;
      animation: imageEntrance 1.6s var(--ease) both;
      transition: transform 0.7s var(--ease);
    }

    .hero__card:hover .hero__image {
      transform: scale(1.018);
    }

    .hero__overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          rgba(11, 5, 10, 0.72) 0%,
          rgba(11, 5, 10, 0.2) 25%,
          rgba(11, 5, 10, 0.04) 56%,
          rgba(11, 5, 10, 0.58) 100%
        ),
        linear-gradient(
          90deg,
          rgba(8, 4, 8, 0.25),
          transparent 22%,
          transparent 78%,
          rgba(8, 4, 8, 0.25)
        );
    }

    .hero__content {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(38px, 7vw, 72px) clamp(20px, 5vw, 52px);
      text-align: center;
      pointer-events: none;
    }

    .hero__eyebrow {
      margin: 0 0 14px;
      color: rgba(255, 240, 246, 0.74);
      font-size: 10px;
      font-weight: 600;
      line-height: 1.2;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      animation: textReveal 0.9s 0.35s var(--ease) both;
    }

    .hero__title {
      margin: 0;
      color: var(--white);
      font-family: "Playfair Display", serif;
      font-weight: 500;
      line-height: 0.82;
      letter-spacing: -0.055em;
      text-shadow:
        0 10px 34px rgba(0, 0, 0, 0.48),
        0 0 28px rgba(255, 189, 214, 0.18);
    }

    .hero__title-line {
      display: block;
      animation: titleReveal 1.1s var(--ease) both;
    }

    .hero__title-line:first-child {
      font-family: "Great Vibes", cursive;
      font-size: clamp(62px, 10vw, 112px);
      font-weight: 400;
      line-height: 0.82;
      letter-spacing: 0;
      color: var(--light-pink);
      animation-delay: 0.45s;
    }

    .hero__title-line--large {
      margin-top: 4px;
      font-size: clamp(48px, 7.7vw, 90px);
      text-transform: uppercase;
      color: transparent;
      background:
        linear-gradient(
          105deg,
          #8b596b 0%,
          #f7d6e1 12%,
          #ffffff 22%,
          #b17c8f 34%,
          #f9e5eb 48%,
          #9d667a 59%,
          #ffffff 72%,
          #d3a2b2 85%,
          #815063 100%
        );
      background-size: 220% 100%;
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-stroke: 1px rgba(255, 255, 255, 0.13);
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, 0.36));
      animation:
        titleReveal 1.1s 0.55s var(--ease) both,
        chromeShine 7s 2s ease-in-out infinite;
    }

    .hero__script {
      margin: 20px 0 0;
      color: var(--light-pink);
      font-family: "Great Vibes", cursive;
      font-size: clamp(30px, 4.2vw, 48px);
      line-height: 1;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      animation: textReveal 1s 0.8s var(--ease) both;
    }

    .hero__message {
      max-width: 520px;
      margin: 18px auto 0;
      color: var(--soft-white);
      font-size: clamp(14px, 1.6vw, 18px);
      font-weight: 300;
      line-height: 1.65;
      letter-spacing: 0.01em;
      text-shadow: 0 6px 20px rgba(0, 0, 0, 0.55);
      animation: textReveal 1s 0.95s var(--ease) both;
    }

    .hero__bottom-label {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 28px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: rgba(255, 247, 250, 0.78);
      background: rgba(18, 8, 16, 0.34);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transform: translateX(-50%);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      animation: bottomReveal 1s 1.15s var(--ease) both;
    }

    .hero__bottom-label::before {
      content: "";
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--pink);
      box-shadow: 0 0 12px rgba(243, 184, 204, 0.8);
    }

    @keyframes cardEntrance {
      from {
        opacity: 0;
        transform: translateY(34px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes imageEntrance {
      from {
        opacity: 0;
        transform: scale(1.06);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes titleReveal {
      from {
        opacity: 0;
        transform: translateY(-28px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes textReveal {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes bottomReveal {
      from {
        opacity: 0;
        transform: translate(-50%, 18px);
      }

      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    @keyframes chromeShine {
      0%,
      18% {
        background-position: 115% 50%;
      }

      48%,
      100% {
        background-position: -115% 50%;
      }
    }

    @keyframes glowPulse {
      0%,
      100% {
        opacity: 0.58;
        transform: scale(0.96);
      }

      50% {
        opacity: 0.9;
        transform: scale(1.04);
      }
    }

    @media (max-width: 768px) {
      .hero {
        min-height: 100svh;
        padding: 14px;
      }

      .hero__shell {
        min-height: calc(100svh - 28px);
      }

      .hero__card {
        width: min(100%, 560px);
        border-radius: 26px;
      }

      .hero__image-wrapper {
        min-height: auto;
      }

      .hero__image {
        width: 100%;
        height: auto;
        max-height: calc(100svh - 28px);
        object-fit: contain;
      }

      .hero__content {
        padding: 30px 18px;
      }

      .hero__eyebrow {
        margin-bottom: 10px;
        font-size: 8px;
        letter-spacing: 0.24em;
      }

      .hero__title-line:first-child {
        font-size: clamp(52px, 16vw, 82px);
      }

      .hero__title-line--large {
        font-size: clamp(38px, 11.5vw, 64px);
      }

      .hero__script {
        margin-top: 14px;
        font-size: clamp(28px, 9vw, 42px);
      }

      .hero__message {
        max-width: 330px;
        margin-top: 12px;
        font-size: 13px;
        line-height: 1.5;
      }

      .hero__bottom-label {
        bottom: 18px;
        padding: 8px 12px;
        font-size: 8px;
        letter-spacing: 0.16em;
      }
    }

    @media (max-width: 430px) {
      .hero {
        padding: 0;
      }

      .hero__shell {
        min-height: 100svh;
      }

      .hero__card {
        width: 100%;
        min-height: 100svh;
        border: 0;
        border-radius: 0;
      }

      .hero__image-wrapper {
        min-height: 100svh;
      }

      .hero__image {
        width: 100%;
        height: 100svh;
        max-height: none;
        object-fit: contain;
      }

      .hero__content {
        padding-top: max(34px, env(safe-area-inset-top));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="hero" id="hero" aria-labelledby="hero-title">
      <div class="hero__shell">
        <div class="hero__glow" aria-hidden="true"></div>

        <div class="hero__card">
          <div class="hero__image-wrapper">
            <img
              class="hero__image"
              src="assets/anniversary-collage.png"
              alt="Romantic anniversary collage featuring the couple"
              width="1122"
              height="1402"
              fetchpriority="high"
              decoding="async"
            >

            <div class="hero__overlay" aria-hidden="true"></div>

            <div class="hero__content">
              <p class="hero__eyebrow">A Love Worth Celebrating</p>

              <h1 class="hero__title" id="hero-title">
                <span class="hero__title-line">Happy</span>
                <span class="hero__title-line hero__title-line--large">Anniversary</span>
              </h1>

              <p class="hero__script">To my beautiful girl</p>

              <p class="hero__message">
                Every moment with you is my favorite.
              </p>
            </div>

            <div class="hero__bottom-label">
              Made with all my love
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const card = document.querySelector(".hero__card");
      const image = document.querySelector(".hero__image");
      const glow = document.querySelector(".hero__glow");
      const finePointer = window.matchMedia("(pointer: fine)").matches;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (!card || !image || !glow || !finePointer || reducedMotion) {
        return;
      }

      let frameId = null;
      let targetRotateX = 0;
      let targetRotateY = 0;
      let currentRotateX = 0;
      let currentRotateY = 0;

      const render = () => {
        currentRotateX += (targetRotateX - currentRotateX) * 0.08;
        currentRotateY += (targetRotateY - currentRotateY) * 0.08;

        card.style.transform =
          `perspective(1400px) rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;

        glow.style.transform =
          `translate(${currentRotateY * 2}px, ${currentRotateX * -2}px) scale(1)`;

        frameId = requestAnimationFrame(render);
      };

      card.addEventListener("pointermove", (event) => {
        const bounds = card.getBoundingClientRect();
        const x = (event.clientX - bounds.left) / bounds.width - 0.5;
        const y = (event.clientY - bounds.top) / bounds.height - 0.5;

        targetRotateY = x * 3;
        targetRotateX = y * -3;
      });

      card.addEventListener("pointerleave", () => {
        targetRotateX = 0;
        targetRotateY = 0;
      });

      frameId = requestAnimationFrame(render);

      window.addEventListener("beforeunload", () => {
        if (frameId) {
          cancelAnimationFrame(frameId);
        }
      });
    })();
  </script>
</body>
</html>
